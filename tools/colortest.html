<!doctype html>
<html><head><meta charset="utf-8"><title>Color Test</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden}
  body{transition:background-color .4s linear}
  #l{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
     font:700 9vw ui-sans-serif,system-ui,sans-serif;color:#0008;letter-spacing:.05em}
</style></head>
<body><div id="l">—</div>
<script>
  const steps=[["RED","#ff0000"],["GREEN","#00ff00"],["BLUE","#0000ff"],["WHITE","#ffffff"]];
  let i=0;
  function tick(){
    const [n,c]=steps[i%steps.length];
    document.body.style.backgroundColor=c;
    document.getElementById('l').textContent=n;
    i++;
  }
  tick(); setInterval(tick,6000);
</script></body></html>
